name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        shell: cmd
        run: call build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: XYZExternal
          path: |
            build/XYZExternal.exe
            build/offsets.ini
